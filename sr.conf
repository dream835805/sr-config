[General]
loglevel = notify
bypass-system = true
skip-proxy = 192.168.0.0/16, 10.0.0.0/8, 127.0.0.1, localhost
dns-server = system, 8.8.8.8, 1.1.1.1
ipv6 = false

[Rule]

# ===== Google 全套（含图片/CDN）=====
DOMAIN-SUFFIX,google.com,PROXY
DOMAIN-SUFFIX,googleapis.com,PROXY
DOMAIN-SUFFIX,gstatic.com,PROXY
DOMAIN-SUFFIX,googleusercontent.com,PROXY
DOMAIN-SUFFIX,ggpht.com,PROXY
DOMAIN-SUFFIX,gmail.com,PROXY

# ===== YouTube 完整（视频 + 缩略图 + CDN）=====
DOMAIN-SUFFIX,youtube.com,PROXY
DOMAIN-SUFFIX,googlevideo.com,PROXY
DOMAIN-SUFFIX,ytimg.com,PROXY
DOMAIN-SUFFIX,i.ytimg.com,PROXY
DOMAIN-SUFFIX,yt3.ggpht.com,PROXY
DOMAIN-SUFFIX,ggpht.com,PROXY

# ===== OpenAI =====
DOMAIN-SUFFIX,openai.com,PROXY
DOMAIN-SUFFIX,chatgpt.com,PROXY

# ===== Claude / Grok =====
DOMAIN-SUFFIX,anthropic.com,PROXY
DOMAIN-SUFFIX,x.ai,PROXY

# ===== X（Twitter）=====
DOMAIN-SUFFIX,x.com,PROXY
DOMAIN-SUFFIX,twitter.com,PROXY

# ===== Meta（Instagram / WhatsApp / Facebook 全覆盖）=====
DOMAIN-SUFFIX,facebook.com,PROXY
DOMAIN-SUFFIX,fbcdn.net,PROXY
DOMAIN-SUFFIX,facebook.net,PROXY
DOMAIN-SUFFIX,instagram.com,PROXY
DOMAIN-SUFFIX,cdninstagram.com,PROXY
DOMAIN-SUFFIX,whatsapp.com,PROXY
DOMAIN-SUFFIX,whatsapp.net,PROXY

# ===== Telegram =====
DOMAIN-SUFFIX,telegram.org,PROXY
IP-CIDR,91.108.0.0/16,PROXY
IP-CIDR,149.154.160.0/20,PROXY

# ===== LINE =====
DOMAIN-SUFFIX,line.me,PROXY
DOMAIN-SUFFIX,line-apps.com,PROXY

# ===== LinkedIn =====
DOMAIN-SUFFIX,linkedin.com,PROXY
DOMAIN-SUFFIX,licdn.com,PROXY

# ===== 本地网络 =====
IP-CIDR,192.168.0.0/16,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT

# ===== 中国流量 =====
GEOIP,CN,DIRECT

# ===== 兜底（关键）=====
FINAL,DIRECT
