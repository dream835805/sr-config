[General]
loglevel = notify
bypass-system = true
skip-proxy = 192.168.0.0/16, 10.0.0.0/8, 127.0.0.1, localhost
dns-server = system, 8.8.8.8, 1.1.1.1
ipv6 = false

[Rule]

# ===== 规则库（核心）=====

# Google（含 Gmail / Chrome / Gemini）
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Google.list,PROXY

# YouTube
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/YouTube.list,PROXY

# Meta（Facebook / Instagram / WhatsApp）
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list,PROXY

# Telegram
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list,PROXY

# OpenAI（ChatGPT）
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/OpenAI.list,PROXY

# Claude（Anthropic）
DOMAIN-SUFFIX,anthropic.com,PROXY

# xAI（Grok）
DOMAIN-SUFFIX,x.ai,PROXY

# X（Twitter）
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Twitter.list,PROXY

# LINE
DOMAIN-SUFFIX,line.me,PROXY
DOMAIN-SUFFIX,line-apps.com,PROXY

# LinkedIn
DOMAIN-SUFFIX,linkedin.com,PROXY
DOMAIN-SUFFIX,licdn.com,PROXY

# ===== 本地网络 =====
IP-CIDR,192.168.0.0/16,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT

# ===== 中国流量 =====
GEOIP,CN,DIRECT

# ===== 兜底 =====
FINAL,DIRECT
